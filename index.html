<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laboratorio de Formas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=4" />
  </head>
  <body>
    <main class="scroll-root" aria-label="Laboratorio de Formas hero sequence">
      <section class="stage">
        <header class="logo-wrap" aria-hidden="true">
          <img class="logo" src="./Logo.svg" alt="" />
        </header>

        <article class="copy" aria-live="polite">
          <p class="line" data-line="0">
            Modern software lives on a premise of infinite evolution. It can always get better, it always needs to do more things.
          </p>

          <p class="line" data-line="1">
            Companies built systems to scale, but lost creativity in the process.
          </p>

          <p class="line" data-line="2">
            <span class="final-prefix">We believe in building simple software that does one thing and </span>
            <span class="strike-target" id="strikeTarget">does it right</span>
            <span class="blue-text" id="typedBlue"></span>
            <span class="cursor" id="typedCursor">|</span>
          </p>
        </article>

        <div class="scroll-cue" id="scrollCue" aria-hidden="true">
          <img src="./Arrow.svg" alt="" />
        </div>
      </section>
    </main>

    <script src="script.js?v=6"></script>
  </body>
</html>
